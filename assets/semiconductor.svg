<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Wafer Circuit Pattern -->
  <circle cx="400" cy="240" r="170" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="400" cy="240" r="130" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="400" cy="240" r="85" fill="none" stroke="#f472b6" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Circuit Connections -->
  <path d="M 120 240 H 280 L 320 280 H 480 L 520 240 H 680" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M 250 140 L 310 200 V 280 L 250 340" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  <path d="M 550 140 L 490 200 V 280 L 550 340" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>

  <!-- Diamond Crystal Structure -->
  <g transform="translate(400, 240)" filter="url(#glow)">
    <!-- Outer Glow Polygon -->
    <polygon points="0,-75 65,-25 65,45 0,80 -65,45 -65,-25" fill="url(#diamondGrad)" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Facets -->
    <polygon points="0,-75 0,0 -65,-25" fill="#bae6fd" fill-opacity="0.4" stroke="#e0f2fe" stroke-width="1"/>
    <polygon points="0,-75 65,-25 0,0" fill="#7dd3fc" fill-opacity="0.3" stroke="#e0f2fe" stroke-width="1"/>
    <polygon points="65,-25 65,45 0,0" fill="#38bdf8" fill-opacity="0.5" stroke="#bae6fd" stroke-width="1"/>
    <polygon points="0,0 65,45 0,80" fill="#0284c7" fill-opacity="0.6" stroke="#bae6fd" stroke-width="1"/>
    <polygon points="0,0 0,80 -65,45" fill="#0369a1" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="-65,-25 0,0 -65,45" fill="#0ea5e9" fill-opacity="0.4" stroke="#7dd3fc" stroke-width="1"/>
    
    <!-- Core Sparkle -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Labels -->
  <text x="400" y="420" font-family="'Pretendard', sans-serif" font-weight="700" font-size="20" fill="#e0f2fe" text-anchor="middle" letter-spacing="1">MONOLITHIC DIAMOND SEMICONDUCTOR</text>
  <text x="400" y="445" font-family="'Pretendard', sans-serif" font-weight="500" font-size="13" fill="#93c5fd" text-anchor="middle" letter-spacing="2">TU KOREA NANO SEMICONDUCTOR LAB</text>
</svg>
