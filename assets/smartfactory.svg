<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="axGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="twinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#axGrad)"/>

  <!-- Isometric Factory Grid Floor -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.2">
    <path d="M 400 120 L 750 300 L 400 480 L 50 300 Z" fill="#0c4a6e" fill-opacity="0.2"/>
    <!-- Grid Lines -->
    <path d="M 120 260 L 470 440 M 190 220 L 540 400 M 260 180 L 610 360 M 330 145 L 680 325"/>
    <path d="M 680 260 L 330 440 M 610 220 L 260 400 M 540 180 L 190 360 M 470 145 L 120 325"/>
  </g>

  <!-- Digital Twin Smart Factory Nodes -->
  <g transform="translate(400, 260)">
    <!-- Factory Cyber Silo / Hologram -->
    <polygon points="0,-120 80,-80 80,40 0,0" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="0,-120 -80,-80 -80,40 0,0" fill="#0369a1" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="0,-120 80,-80 0,-40 -80,-80" fill="#38bdf8" fill-opacity="0.6" stroke="#7dd3fc" stroke-width="1.5"/>

    <!-- Robotic Arm Silhouette -->
    <path d="M 120 40 L 150 -20 L 210 -10 L 230 30" stroke="#facc15" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="40" r="10" fill="#eab308"/>
    <circle cx="150" cy="-20" r="6" fill="#fde047"/>
    <circle cx="210" cy="-10" r="5" fill="#fde047"/>

    <!-- AI Data Stream Rings -->
    <ellipse cx="0" cy="-40" rx="140" ry="40" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="8 6"/>
    <ellipse cx="0" cy="20" rx="180" ry="50" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 6"/>
    
    <!-- Pulse Dots -->
    <circle cx="-130" cy="-30" r="5" fill="#34d399"/>
    <circle cx="130" cy="-50" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="70" r="6" fill="#f43f5e"/>
  </g>

  <!-- Title Overlay -->
  <text x="400" y="425" font-family="'Pretendard', sans-serif" font-weight="700" font-size="20" fill="#bae6fd" text-anchor="middle" letter-spacing="1">AI-DRIVEN DIGITAL TWIN FACTORY (AX)</text>
  <text x="400" y="450" font-family="'Pretendard', sans-serif" font-weight="500" font-size="13" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">TU KOREA AX HUB & SIMULATION CENTER</text>
</svg>
